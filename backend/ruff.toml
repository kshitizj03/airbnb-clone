line-length = 100

[lint]
extend-select = ["I"]  # default rules plus import sorting

[lint.flake8-bugbear]
# FastAPI's Depends() and Query() in argument defaults are its documented pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.isort]
split-on-trailing-comma = false  # an import that fits on one line stays on one line
