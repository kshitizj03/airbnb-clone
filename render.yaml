services:
  - type: web
    name: stayhub-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/storage/app.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.11
