name: Reset demo data

# Rebuilds the live demo database every night, so visitors' bookings, listings and reviews
# do not pile up. Needs two repo secrets: NEON_DATABASE_URL (Neon's unpooled connection
# string) and DEMO_PASSWORD (the password the seed gives every seeded account).
on:
  schedule:
    - cron: "30 21 * * *" # 21:30 UTC = 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-demo

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - name: Check the secrets are set
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DEMO_PASSWORD" ]; then
            echo "::error::Add the repo secrets NEON_DATABASE_URL (Neon unpooled connection string) and DEMO_PASSWORD."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.seed --reset
